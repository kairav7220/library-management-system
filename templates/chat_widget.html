<!-- Chat assistant (multi-agent) -->
<button type="button" class="launcher" id="launcher" onclick="openWidget()" aria-label="Ask the library">
    <span class="stamp">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5C4 5 7 4.5 9 5.5c1 .5 2 1.5 3 3 1-1.5 2-2.5 3-3 2-1 5-.5 7 1v13c-2-1.5-5-2-7-1-1 .5-2 1.5-3 3-1-1.5-2-2.5-3-3-2-1-5-.5-7 1z"/><path d="M12 8.5V21"/></svg>
    </span>
    <span class="badge" id="badge" hidden>0</span>
    Ask the Library
</button>

<div class="widget" id="widget" role="dialog" aria-label="Library assistant chat" aria-hidden="true">
    <div class="head">
        <div class="head-row">
            <div class="head-id">
                <div class="head-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5C4 5 7 4.5 9 5.5c1 .5 2 1.5 3 3 1-1.5 2-2.5 3-3 2-1 5-.5 7 1v13c-2-1.5-5-2-7-1-1 .5-2 1.5-3 3-1-1.5-2-2.5-3-3-2-1-5-.5-7 1z"/><path d="M12 8.5V21"/></svg>
                </div>
                <div>
                    <p class="head-eyebrow">Reference Desk</p>
                    <h1 class="head-title">Ask the Library</h1>
                    <div class="head-status"><span class="dot"></span><span>Librarians on duty</span></div>
                </div>
            </div>
            <div class="head-actions">
                <button type="button" class="action-btn" id="historyBtn" onclick="showSessions()" aria-label="Chat history" title="History">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <button type="button" class="action-btn" id="resetBtn" onclick="resetChat()" aria-label="Start new chat" title="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button type="button" class="action-btn" onclick="closeWidget()" aria-label="Close chat">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="thread" id="thread" role="log" aria-live="polite">
        <div class="msg bot" id="greeting">
            <span class="msg-label"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>Reference Librarian</span>
            <div class="bubble">
                Welcome to the Reference Desk. Ask me to find a book, register a member, issue a book, or pull up library stats.
            </div>
        </div>
    </div>

    <div class="session-list" id="sessionList" hidden>
        <div class="session-list-head">
            <button type="button" class="back-btn" onclick="hideSessions()" aria-label="Back to chat">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <span>Chat history</span>
        </div>
        <div class="session-list-body" id="sessionListBody"></div>
    </div>

    <div class="composer">
        <textarea id="input" rows="1" placeholder="Message the library…" autocomplete="off" aria-label="Your message" onkeydown="onKey(event)"></textarea>
        <button type="button" class="send-btn" onclick="send()" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 20 18-8L3 4v6l12 2-12 2z"/></svg>
        </button>
    </div>
    <p class="foot-note">Catalog data may take a moment to update</p>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='styles/chat.css') }}">
<script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
