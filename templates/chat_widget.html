<!-- ─────────────────────────────────────────────
     Library Chat Widget  — Glassmorphism Dark UI
     ───────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/chat.css') }}">

<!-- Launcher pill -->
<button type="button" class="launcher" id="launcher" onclick="openWidget()" aria-label="Ask the library">
    <span class="stamp" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    </span>
    <span class="badge" id="badge" hidden>0</span>
    Ask the Library
</button>

<!-- Widget panel -->
<div class="widget" id="widget" role="dialog" aria-label="Library assistant chat" aria-hidden="true">

    <!-- Header -->
    <div class="head">
        <div class="head-row">
            <div class="head-id">
                <div class="head-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 6.5C4 5 7 4.5 9 5.5c1 .5 2 1.5 3 3 1-1.5 2-2.5 3-3 2-1 5-.5 7 1v13c-2-1.5-5-2-7-1-1 .5-2 1.5-3 3-1-1.5-2-2.5-3-3-2-1-5-.5-7 1z"/>
                        <path d="M12 8.5V21"/>
                    </svg>
                </div>
                <div>
                    <p class="head-eyebrow">Reference Desk</p>
                    <h1 class="head-title">Ask the Library</h1>
                    <div class="head-status">
                        <span class="dot" aria-hidden="true"></span>
                        <span>Librarians on duty</span>
                    </div>
                </div>
            </div>
            <div class="head-actions">
                <button type="button" class="action-btn" id="historyBtn" onclick="showSessions()" aria-label="Chat history" title="History">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M12 7v5l3 3"/>
                    </svg>
                </button>
                <button type="button" class="action-btn" id="resetBtn" onclick="resetChat()" aria-label="New chat" title="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
                <button type="button" class="action-btn" onclick="closeWidget()" aria-label="Close chat" title="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Message thread -->
    <div class="thread" id="thread" role="log" aria-live="polite">
        <div class="msg bot" id="greeting">
            <span class="msg-label">
                <span class="agent-dot" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                </span>
                Reference Librarian
            </span>
            <div class="welcome-card">
                <p>Welcome to the <strong>Reference Desk</strong> 👋</p>
                <p>I can help you find books, register members, issue &amp; return books, manage subscriptions, or pull up library stats.</p>
            </div>
            <span class="timestamp" id="greet-time"></span>
        </div>
    </div>

    <!-- Scroll-to-bottom nudge -->
    <button type="button" class="scroll-nudge" id="scrollNudge" onclick="scrollBottom()" aria-label="Scroll to latest">
        ↓ New message
    </button>

    <!-- Session history overlay -->
    <div class="session-list" id="sessionList" hidden>
        <div class="session-list-head">
            <button type="button" class="back-btn" onclick="hideSessions()" aria-label="Back to chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <span>Chat history</span>
        </div>
        <div class="session-list-body" id="sessionListBody"></div>
    </div>

    <!-- Composer -->
    <div class="composer">
        <div class="input-wrap">
            <textarea id="input" rows="1" placeholder="Message the library…" autocomplete="off"
                      aria-label="Your message" onkeydown="onKey(event)"></textarea>
        </div>
        <button type="button" class="send-btn" id="sendBtn" onclick="send()" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 20 18-8L3 4v6l12 2-12 2z"/>
            </svg>
        </button>
    </div>
    <p class="foot-note">Powered by multi-agent AI · responses may take a moment</p>

</div>

<script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
